version: '3.9'
services:
  gateway-service:
    container_name: gateway-service
    build: .
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '1'
          memory: 1024M
    volumes:
      - ./ApiGateway-0.0.1.jar:/app/app.jar
    ports:
      - 8080:8080
    restart: always
    env_file: .env
    command: [ "java", "-jar", "app.jar" ]
    networks:
      - blog
networks:
  blog:
    external: true
